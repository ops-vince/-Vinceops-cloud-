name: VinceOps Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "04-Containerization/frontend/netflix_frontend/**"
      - ".github/workflows/vinceops-frontend-ci.yml"

  pull_request:
    paths:
      - "04-Containerization/frontend/netflix_frontend/**"
      - ".github/workflows/vinceops-frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ops-vince/vinceops-frontend
  FRONTEND_PATH: 04-Containerization/frontend/netflix_frontend

jobs:
  frontend-build:
    name: Validate React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 04-Containerization/frontend/netflix_frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 04-Containerization/frontend/netflix_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          test -s build/index.html
          test -d build/static/js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinceops-frontend-build
          path: 04-Containerization/frontend/netflix_frontend/build/
          if-no-files-found: error

  publish-image:
    name: Docker Build, Smoke Test and Publish
    needs: frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: 04-Containerization/frontend/netflix_frontend
          load: true
          tags: vinceops-frontend:smoke

      - name: Test running container
        run: |
          docker run -d \
            --name vinceops-smoke \
            -p 127.0.0.1:18085:8080 \
            vinceops-frontend:smoke

          trap 'docker rm -f vinceops-smoke' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:18085/healthz | grep -qx ok

          curl --fail --silent --show-error \
            http://127.0.0.1:18085/ > /dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: 04-Containerization/frontend/netflix_frontend
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ops-vince/-Vinceops-cloud-
            org.opencontainers.image.revision=${{ github.sha }}
