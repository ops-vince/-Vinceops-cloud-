name: VinceOps Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "04-Containerization/frontend/netflix_frontend/**"
      - ".github/workflows/vinceops-frontend-ci.yml"

  pull_request:
    paths:
      - "04-Containerization/frontend/netflix_frontend/**"
      - ".github/workflows/vinceops-frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 04-Containerization/frontend/netflix_frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 04-Containerization/frontend/netflix_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -s build/index.html
          test -d build/static/js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinceops-frontend-build
          path: 04-Containerization/frontend/netflix_frontend/build/
          if-no-files-found: error
