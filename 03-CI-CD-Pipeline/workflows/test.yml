name: Test Application

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository files
        run: ls -la

      - name: Show runner information
        run: uname -a

      - name: Run test message
        run: echo "Testing application"
