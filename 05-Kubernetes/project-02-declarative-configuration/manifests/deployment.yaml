apiVersion: apps/v1
kind: Deployment
metadata:
  name: vinceops-web
  namespace: vinceops-demo
  labels:
    app: vinceops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vinceops-web
  template:
    metadata:
      labels:
        app: vinceops-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: vinceops-web-content
